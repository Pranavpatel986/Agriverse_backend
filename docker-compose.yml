version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriverse-postgres
    environment:
      POSTGRES_DB: agriverse
      POSTGRES_USER: agriverse
      POSTGRES_PASSWORD: agriverse
    ports:
      - "5432:5432"
    volumes:
      - agriverse-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agriverse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agriverse-pg-data:
